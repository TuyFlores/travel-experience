<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Travel Experience</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

    <header>
        <h1>✈️Travel Experience</h1>
        <nav>
            <a href="/index.html">Inicio</a>
            <a href="index.html#destino">Destinos</a>
        </nav>
    </header>

    <main class="area-cadastro">
        <form id="formCadastro">
            <h2>Planejar sua proxima Viagem</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">Email:</label>
            <input type="text"  id="email" placeholder="seu@email.com" required><br><br>

            <label for="destino">Destinos desejados:</label>
            <select  id="destino" name="destino" required>
                    <option value="">Escolha seu Destino</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Paris">Paris</option>
                    <option value="Maldivas">Maldivas</option>
            </select>
            <button type="submit">Enviar Cadastros</button>
            <p id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">
                        Voltar ao Inicio
            </a>
        </form>
    </main>
    <footer>
        <p>Travel Experience 2026</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
